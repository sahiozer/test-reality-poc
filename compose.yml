# Local development only. The existing infra/compose*.yml deployment is independent.
name: test-reality-local

x-runtime: &runtime
  restart: unless-stopped
  networks: [backend]
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  postgres:
    # PostgreSQL's official entrypoint needs its normal ownership capabilities.
    restart: unless-stopped
    networks: [backend]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: test_reality
      POSTGRES_USER: test_reality
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
    command: [postgres, -c, shared_buffers=96MB, -c, work_mem=8MB, -c, max_connections=20, -c, maintenance_work_mem=32MB, -c, max_parallel_workers_per_gather=0]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-base.sql:ro
      - ./infra/cards.sql:/docker-entrypoint-initdb.d/002-cards.sql:ro
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test_reality -d test_reality"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  analysis:
    <<: *runtime
    image: test-reality-local-analysis:dev
    build: {context: ., dockerfile: analysis/Dockerfile}
    environment:
      DATABASE_URL: postgresql://test_reality:${DATABASE_PASSWORD}@postgres:5432/test_reality
      LOCAL_TEST_REPAIR_ENABLED: "true"
      REPAIR_DATABASE_URL: postgresql://test_reality_repair:${REPAIR_DATABASE_PASSWORD:-local_repair_only_change_me}@postgres:5432/test_reality
    volumes: ["./scripts/local:/opt/local-tools:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    read_only: true
    tmpfs: [/tmp:size=32m]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  backend:
    <<: *runtime
    image: test-reality-local-backend:dev
    build: {context: ., dockerfile: infra/local/backend.Dockerfile}
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/test_reality
      DATABASE_USER: test_reality
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ANALYSIS_URL: http://analysis:8000
      LOCAL_TEST_REPAIR_ENABLED: "true"
      LLM_ENABLED: ${LLM_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:0.5b
      LLM_TIMEOUT_SECONDS: "120"
    ports: ["127.0.0.1:${BACKEND_PORT:-18081}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      analysis: {condition: service_healthy}
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 1
    read_only: true
    tmpfs: [/tmp:size=32m]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

  frontend:
    <<: *runtime
    image: test-reality-local-frontend:dev
    build: {context: ., dockerfile: infra/local/frontend.Dockerfile}
    ports: ["127.0.0.1:${FRONTEND_PORT:-18080}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp:size=16m]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    <<: *runtime
    profiles: [ai]
    image: ollama/ollama:0.40.2
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_VULKAN: "0"
      CUDA_VISIBLE_DEVICES: "-1"
    volumes: [ollama_models:/root/.ollama]
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1
    read_only: true
    tmpfs: [/tmp:size=32m]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

networks:
  backend:
    driver: bridge
volumes:
  postgres_data:
  ollama_models:
