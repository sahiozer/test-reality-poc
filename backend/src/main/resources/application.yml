server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: test-reality
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:15432/test_reality}
    username: ${DATABASE_USER:test_reality}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
analysis:
  url: ${ANALYSIS_URL:http://localhost:18082}
explanation:
  enabled: ${LLM_ENABLED:false}
  ollama-url: ${OLLAMA_URL:http://ollama:11434}
  model: ${LLM_MODEL:qwen2.5:0.5b}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:75}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
