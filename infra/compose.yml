name: test-reality-poc

x-limits: &limits
  restart: unless-stopped
  networks: [backend]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  postgres:
    <<: *limits
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: test_reality
      POSTGRES_USER: test_reality
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in infra/.env}
    command: [postgres, -c, shared_buffers=96MB, -c, work_mem=8MB, -c, max_connections=20, -c, maintenance_work_mem=32MB, -c, max_parallel_workers_per_gather=0]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.25
    shm_size: 64m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test_reality -d test_reality"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  analysis:
    <<: *limits
    image: test-reality-poc-analysis:${POC_IMAGE_TAG:-0.1.0}
    build: {context: .., dockerfile: analysis/Dockerfile}
    environment:
      DATABASE_URL: postgresql://test_reality:${DATABASE_PASSWORD}@postgres:5432/test_reality
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.30
    read_only: true
    tmpfs: [/tmp:size=32m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    <<: *limits
    image: test-reality-poc-backend:${POC_IMAGE_TAG:-0.1.0}
    build: {context: .., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/test_reality
      DATABASE_USER: test_reality
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ANALYSIS_URL: http://analysis:8000
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      analysis: {condition: service_healthy}
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.35
    read_only: true
    tmpfs: [/tmp:size=32m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    <<: *limits
    image: test-reality-poc-frontend:${POC_IMAGE_TAG:-0.1.0}
    build: {context: .., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.05
    read_only: true
    tmpfs: [/tmp:size=16m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  backend:
    name: test-reality-poc_backend
    driver: bridge

volumes:
  postgres_data:
    name: test-reality-poc_postgres_data
